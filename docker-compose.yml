version: "3.9"

services:

  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend
    container_name: nsw-bi-backend
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Australia/Sydney
    volumes:
      - db_data:/data          # SQLite persisted outside the container
    ports:
      - "8000:8000"            # Expose for local dev / Swagger UI
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - app_net

  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend
      args:
        # During Docker build, frontend proxies /api → backend container
        VITE_API_URL: ""
    container_name: nsw-bi-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app_net

volumes:
  db_data:
    driver: local

networks:
  app_net:
    driver: bridge
